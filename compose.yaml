services:
  dev:
    image: dev_nagare
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ./:/src/
      - ~/.gitconfig:/.gitconfig
      - ~/.ssh/:/home/user/.ssh/
      - /var/run/docker.sock:/var/run/docker-host.sock
    tty: true
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
